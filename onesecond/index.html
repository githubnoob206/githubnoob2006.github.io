<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f"><meta name="description" content="One second. One move. A timing duel played on a tic-tac-toe board.">
  <title>ONE SECOND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%230b0c0f'/%3E%3Cpath d='M17 18L31 46M31 18L17 46' stroke='%23ff565f' stroke-width='5'/%3E%3Ccircle cx='45' cy='32' r='10' fill='none' stroke='%235d99ff' stroke-width='5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script><script src="engine.js" defer></script><script src="app.js" defer></script>
</head>
<body>
  <div class="ambient red"></div><div class="ambient blue"></div>
  <header><button class="brand" id="home" aria-label="Main menu"><span class="brand-symbol">×<i>○</i></span> ONE SECOND</button><button id="account" class="quiet account">Sign in <span>↗</span></button></header>
  <main>
    <section id="menu" class="screen menu">
      <div class="hero"><div class="eyebrow">A GAME OF PERFECT TIMING</div><h1>One second.<br><span>One move.</span></h1><p>Hit 1.00. Take the board.</p></div>
      <div class="preview" aria-hidden="true"><div class="preview-board"><b class="x">×</b><b></b><b class="o">○</b><b></b><b class="x">×</b><b></b><b class="o">○</b><b></b><b class="x">×</b></div><div class="preview-time"><span class="live-dot"></span><span id="demo-time">1.00</span><small>s</small></div></div>
      <div class="play-options"><button class="play-card" id="bot-menu"><span class="option-icon">◎</span><span>Solo<small>vs. bot</small></span><span class="arrow">↗</span></button><button class="play-card" id="local"><span class="option-icon duo">Ⅱ</span><span>Local<small>two players</small></span><span class="arrow">↗</span></button><button class="play-card online" id="online"><span class="option-icon">⌁</span><span>Online<small>find a rival</small></span><span class="arrow">↗</span></button></div>
      <nav class="menu-tools"><button id="stats">Stats</button><span>·</span><button id="leaderboard">Leaderboard</button><span>·</span><button id="settings">Settings</button></nav>
      <footer><span>PRECISION WINS.</span><button id="how">How to play <span>?</span></button></footer>
    </section>
    <section id="waiting" class="screen waiting" hidden><div class="orbital"><span>×</span><i>○</i></div><h2 id="waiting-title">Finding a rival<span class="dots">…</span></h2><p id="waiting-sub">You're in the queue.</p><button class="primary" id="offline" hidden>Play offline</button><button class="quiet" id="cancel-queue">Cancel</button></section>
    <section id="game" class="screen game" hidden>
      <div class="game-top"><button id="leave" class="quiet">← Menu</button><span id="mode-label">LOCAL</span><span id="connection"></span></div>
      <div class="arena">
        <div class="player player-x" id="player-0"><div class="player-id"><span class="mark mini x">×</span><span id="name-0">Player 1</span></div><div class="timer"><span id="timer-0">0.00</span><small>s</small></div><div class="meter"><i id="meter-0"></i></div><button class="stop" id="stop-0" aria-label="Stop X timer">STOP <span id="key-0">A</span></button></div>
        <div class="board-area"><div class="round-label" id="round-label">ROUND 01</div><div class="board" id="board" aria-label="Tic-tac-toe board"></div><div class="status" id="status" aria-live="polite"></div></div>
        <div class="player player-o" id="player-1"><div class="player-id"><span class="mark mini o">○</span><span id="name-1">Player 2</span></div><div class="timer"><span id="timer-1">0.00</span><small>s</small></div><div class="meter"><i id="meter-1"></i></div><button class="stop" id="stop-1" aria-label="Stop O timer">STOP <span id="key-1">L</span></button></div>
      </div>
      <div class="game-bottom"><span id="target">TARGET <b>1.00s</b></span><button class="primary" id="again" hidden>Play again <span>↗</span></button><span id="step-label">0.02s</span></div>
    </section>
  </main>
  <dialog id="dialog"><div class="modal-head"><span id="modal-label">ONE SECOND</span><button id="close-dialog" class="icon-button" aria-label="Close">×</button></div><div id="modal-body"></div></dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
