<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111315"><title>Crab Tank — Spin a card</title>
<meta name="description" content="Spin the Crab Tank card wheel.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23111315'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-size='39'%3E%F0%9F%A6%80%3C/text%3E%3C/svg%3E">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{font-family:'DM Sans',system-ui,sans-serif;color:#f7f5ef;background:#111315;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse 75% 45% at 50% 14%,#333537 0%,#17191b 54%,#101112 100%)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #f8bd63;outline-offset:4px}.app{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:clamp(20px,4vh,38px) 18px max(24px,env(safe-area-inset-bottom));overflow:hidden}.brand{font-family:'Space Grotesk',sans-serif;font-size:clamp(19px,3vw,24px);letter-spacing:-.06em;font-weight:700;display:flex;align-items:center;gap:10px;text-transform:lowercase}.mark{width:31px;height:31px;background:#f89562;color:#1c1411;border-radius:9px;display:grid;place-items:center;font-size:20px;line-height:1;transform:rotate(-7deg)}.stage{width:min(100%,480px);flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:27px 0 36px}.eyebrow{color:#ffa56d;text-transform:uppercase;letter-spacing:.2em;font-size:12px;font-weight:800;margin:0 0 12px}.title{font-family:'Space Grotesk',sans-serif;letter-spacing:-.05em;font-weight:700;text-align:center;font-size:clamp(30px,7vw,44px);line-height:1.12;margin:0 0 12px}.sub{color:#aeb0ae;font-size:15px;text-align:center;margin:0 0 28px}.cards{width:100%;display:grid;gap:10px}.card{width:100%;min-height:65px;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;border:1px solid #414347;border-radius:17px;color:#f9f8f3;background:linear-gradient(120deg,#292b2e,#222426);box-shadow:0 4px 0 #0b0c0d;transition:transform .17s,background .17s,border-color .17s}.card:hover{transform:translateY(-3px);background:#343638;border-color:#7e8180}.card:active{transform:translateY(2px);box-shadow:0 1px 0 #090a0b}.amount{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.035em;font-size:clamp(17px,4.4vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap}.chance{color:#b5b8b3;font-size:clamp(12px,3.3vw,14px);font-weight:700;white-space:nowrap}.chance strong{color:#90d99e}.hint{color:#808480;font-size:13px;margin-top:26px;text-align:center}.spin-view{display:none;width:100%;flex-direction:column;align-items:center}.spin-view.active{display:flex}.picker.hidden{display:none}.selected{font-family:'Space Grotesk',sans-serif;font-size:clamp(25px,6vw,35px);font-weight:700;letter-spacing:-.04em;margin:0 0 9px}.prob{color:#bbbebb;font-size:15px;margin:0 0 25px}.wheel-wrap{width:min(100%,370px);aspect-ratio:1;position:relative;display:grid;place-items:center;filter:drop-shadow(0 17px 28px #0008);margin:0 0 20px}.wheel{width:93%;height:93%;border-radius:50%;position:relative;border:9px solid #f4e6d2;box-shadow:inset 0 0 0 2px #101112,0 0 0 5px #393634;transform:rotate(0deg);will-change:transform}.wheel:after{content:'';position:absolute;inset:12px;border:1px solid #ffffff60;border-radius:50%;pointer-events:none}.wheel-label{position:absolute;font-family:'Space Grotesk',sans-serif;font-size:clamp(13px,3.4vw,17px);font-weight:700;color:white;text-shadow:0 2px 9px #0008;white-space:nowrap;left:50%;top:50%;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(calc(var(--rad) * -1)) rotate(calc(var(--angle) * -1))}.pointer{position:absolute;z-index:3;top:-4px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:19px solid transparent;border-right:19px solid transparent;border-top:35px solid #ffd099;filter:drop-shadow(0 3px 2px #0009)}.hub{position:absolute;z-index:2;width:23%;height:23%;border-radius:50%;background:#f3eadb;border:6px solid #292727;box-shadow:0 3px 10px #0009;display:grid;place-items:center;color:#242424;font-size:30px}.spin-button{border:0;background:#ffab70;color:#211913;border-radius:16px;padding:16px 24px;width:min(100%,320px);font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;box-shadow:0 5px 0 #aa603b;transition:transform .14s}.spin-button:hover{background:#ffc08f}.spin-button:active{transform:translateY(4px);box-shadow:0 1px 0 #aa603b}.spin-button:disabled{opacity:.62;cursor:default}.result{min-height:54px;text-align:center;font-family:'Space Grotesk',sans-serif;font-size:clamp(19px,5vw,27px);font-weight:700;letter-spacing:-.03em;margin:10px 0 4px}.result.win{color:#a8efb5}.result.lose{color:#ffa099}.back{display:none;border:1px solid #515558;color:#eee;background:#292c2e;border-radius:13px;padding:13px 20px;min-height:48px;margin-top:13px;font-weight:700}.back.visible{display:block}.back:hover{background:#393c3f}.footer{color:#666a68;font-size:12px;text-align:center;letter-spacing:.02em}.burst{position:absolute;inset:0;pointer-events:none;overflow:visible}.piece{position:absolute;left:50%;top:48%;width:8px;height:14px;background:var(--c);border-radius:2px;animation:fly .9s ease-out forwards;transform:translate(-50%,-50%)}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(var(--r));opacity:0}}@media(max-height:740px){.stage{padding:15px 0}.title{font-size:32px}.sub{margin-bottom:20px}.card{min-height:58px}.wheel-wrap{width:min(100%,290px);margin-bottom:12px}.prob{margin-bottom:19px}.result{min-height:43px}}@media(max-width:360px){.card{padding-inline:11px}.chance{font-size:12px}.wheel-label{font-size:13px}}@media(prefers-reduced-motion:reduce){.card,.spin-button{transition:none}.piece{animation-duration:.01ms}}
</style>
</head>
<body><main class="app"><div class="brand"><span class="mark" aria-hidden="true">🦀</span> crab tank</div><div class="stage"><section class="picker" id="picker" aria-labelledby="pick-title"><p class="eyebrow">The wheel</p><h1 class="title" id="pick-title">Pick card value</h1><p class="sub">Choose a card, then take your shot.</p><div class="cards" id="cards"></div><p class="hint">Green wins the card value · Red lands on $0</p></section><section class="spin-view" id="spin-view" aria-label="Spin the wheel"><p class="eyebrow">Your card</p><h1 class="selected" id="selected"></h1><p class="prob" id="prob"></p><div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div><div class="wheel" id="wheel" aria-label="Wheel with green win and red zero sections"><span class="wheel-label" id="win-label"></span><span class="wheel-label" id="lose-label">$0</span></div><div class="hub" aria-hidden="true">🦀</div><div class="burst" id="burst"></div></div><button class="spin-button" id="spin">SPIN THE WHEEL</button><div class="result" id="result" role="status" aria-live="polite"></div><button class="spin-button" id="again" style="display:none">SPIN AGAIN</button><button class="back" id="back">← Back to cards</button></section></div><div class="footer">Just for the game · No values are saved</div></main>
<script>
const options=[{value:1000000,chance:10},{value:500000,chance:20},{value:250000,chance:40},{value:150000,chance:50},{value:75000,chance:80}];
const $=id=>document.getElementById(id),fmt=n=>'$'+n.toLocaleString('en-US');
let current=null,rotation=0,spinning=false;
options.forEach(option=>{const button=document.createElement('button');button.className='card';button.type='button';button.innerHTML=`<span class="amount">${fmt(option.value)}</span><span class="chance"><strong>${option.chance}%</strong> chance ↗</span>`;button.addEventListener('click',()=>openCard(option));$('cards').append(button)});
function openCard(option){current=option;rotation=0;spinning=false;$('picker').classList.add('hidden');$('spin-view').classList.add('active');$('selected').textContent=fmt(option.value);$('prob').textContent=`${option.chance}% chance to win`;$('wheel').style.transition='none';$('wheel').style.transform='rotate(0deg)';$('wheel').style.background=`conic-gradient(#38b875 0 ${option.chance}%, #e45b57 ${option.chance}% 100%)`;$('wheel').setAttribute('aria-label',`${option.chance}% green wins ${fmt(option.value)}; ${100-option.chance}% red wins $0`);placeLabel('win-label',option.chance*1.8);placeLabel('lose-label',(option.chance+100)*1.8);$('win-label').textContent='$'+(option.value>=1000000?'1M':(option.value/1000)+'K');$('spin').hidden=false;$('spin').disabled=false;$('again').style.display='none';$('again').disabled=false;$('result').textContent='';$('result').className='result';$('back').classList.remove('visible');$('burst').replaceChildren()}
function placeLabel(id,angle){let el=$(id);el.style.setProperty('--angle',angle+'deg');el.style.setProperty('--rad','clamp(78px, 26vw, 112px)')}
function random(){const bytes=new Uint32Array(1);crypto.getRandomValues(bytes);return bytes[0]/4294967296}
function spinWheel(){if(spinning||!current)return;spinning=true;$('spin').disabled=true;$('again').disabled=true;$('again').style.display='none';$('back').classList.remove('visible');$('result').textContent='Spinning…';$('result').className='result';$('burst').replaceChildren();let win=random()<current.chance/100;const span=win?current.chance:100-current.chance;const start=win?0:current.chance;const margin=Math.min(3,span*.16);const target=(start+margin+random()*(span-2*margin))*3.6;const desired=(360-target)%360;const previous=((rotation%360)+360)%360;const advance=(desired-previous+360)%360;rotation+=360*6+advance;const wheel=$('wheel');wheel.style.transition='transform 4.7s cubic-bezier(.15,.8,.13,1)';requestAnimationFrame(()=>{wheel.style.transform=`rotate(${rotation}deg)`});wheel.addEventListener('transitionend',function done(event){if(event.propertyName!=='transform')return;wheel.removeEventListener('transitionend',done);spinning=false;$('result').textContent=win?`You won ${fmt(current.value)}!`:'Landed on $0';$('result').className='result '+(win?'win':'lose');$('spin').hidden=true;$('again').style.display='block';$('again').disabled=false;$('back').classList.add('visible');if(win)confetti()})}
$('spin').addEventListener('click',spinWheel);
$('again').addEventListener('click',spinWheel);
function confetti(){const burst=$('burst');for(let i=0;i<24;i++){let piece=document.createElement('i');piece.className='piece';piece.style.setProperty('--c',['#f8ae71','#8be2a0','#f4e4cd'][i%3]);let angle=random()*Math.PI*2,dist=85+random()*120;piece.style.setProperty('--x',Math.cos(angle)*dist+'px');piece.style.setProperty('--y',Math.sin(angle)*dist+'px');piece.style.setProperty('--r',Math.round(random()*700)+'deg');burst.append(piece)}setTimeout(()=>burst.replaceChildren(),1100)}
$('back').addEventListener('click',()=>{if(spinning)return;current=null;$('spin-view').classList.remove('active');$('picker').classList.remove('hidden')});
if(document.modelContext?.registerTool){
  Promise.resolve(document.modelContext.registerTool({name:'choose_card',title:'Choose card',description:'Select one of the five card values and show its wheel.',inputSchema:{type:'object',properties:{value:{type:'integer',enum:options.map(o=>o.value)}},required:['value'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){const option=options.find(o=>o.value===input?.value);if(!option||spinning)throw new Error('Invalid card or wheel is spinning');openCard(option);return {value:option.value,chance:option.chance}}})).catch(()=>{});
  Promise.resolve(document.modelContext.registerTool({name:'spin_card',title:'Spin card',description:'Spin the selected card wheel and return the landed result.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false},execute(){if(!current||spinning)throw new Error('Select a card before spinning');const value=current.value;return new Promise(resolve=>{const wheel=$('wheel');wheel.addEventListener('transitionend',function done(e){if(e.propertyName!=='transform')return;wheel.removeEventListener('transitionend',done);setTimeout(()=>resolve({cardValue:value,result:$('result').textContent}),0)});$('spin').click()})}})).catch(()=>{});
}
</script></body></html>
